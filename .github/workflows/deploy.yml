name: Deploy Puncher
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        default: dev
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: puncher-${{ inputs.environment }}
    concurrency: puncher-${{ inputs.environment }}
    env:
      PUNCHER_ENV: ${{ inputs.environment }}
      PUNCHER_ACCOUNT: ${{ vars.PUNCHER_ACCOUNT }}
      PUNCHER_DOMAIN: ${{ vars.PUNCHER_DOMAIN }}
      PUNCHER_ZONE_NAME: ${{ vars.PUNCHER_ZONE_NAME }}
      PUNCHER_ZONE_ID: ${{ vars.PUNCHER_ZONE_ID }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      STATS_URL: ${{ vars.STATS_URL }}
      PUNCHER_GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run cdk:synth
      - run: npm test
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PUNCHER_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - run: mkdir -p work
      - run: npm run cdk:deploy -- --require-approval never --outputs-file work/deployment-outputs.json
